
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaviRadio</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --card: #1f242d;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e3440;
      --fringe: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
    .nav-tabs { display: flex; gap: 10px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .container { display: none; }
    .login-box {
      max-width: 380px;
      margin: 80px auto;
      background: var(--panel);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }
    .app-shell {
      flex: 1;
      min-height: 0;
      display: none;
      grid-template-columns: 280px 1fr;
    }
    .app-shell.visible { display: grid; }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px 10px 18px;
    }
    .side-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 10px 6px;
      font-weight: 700;
    }
    .side-empty { color: var(--muted); font-size: 0.8rem; padding: 4px 12px 8px; }
    .side-station {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      font-weight: 500;
      cursor: pointer;
    }
    .side-station:hover { background: var(--card); }
    .side-station.active { background: #243044; color: #fff; }
    .side-station img {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--card);
      flex-shrink: 0;
    }
    .side-station .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    button.side-heart {
      width: 28px;
      height: 28px;
      padding: 0;
      margin-left: auto;
      background: transparent;
      color: var(--muted);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    button.side-heart:hover { background: transparent; color: #fb7185; }
    button.side-heart.faved { color: #fb7185; }
    .main-pane { overflow-y: auto; padding: 22px 28px 28px; }
    .admin-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 860px) {
      .app-shell.visible { grid-template-columns: 1fr; }
      .sidebar { max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
      .admin-grid { grid-template-columns: 1fr; }
    }
    .station-hero { display: flex; gap: 22px; align-items: flex-end; margin-bottom: 22px; }
    .hero-cover {
      width: 168px;
      height: 168px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }
    .eyebrow { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .station-hero h1 { font-size: 2rem; line-height: 1.1; margin-bottom: 8px; }
    .station-hero p { color: var(--muted); max-width: 640px; }
    .hero-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    button.play-big, button.text-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.play-big {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 0;
      background: var(--accent);
    }
    button.play-big:hover { background: var(--accent-hover); }
    button.text-btn {
      gap: 8px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
    }
    button.text-btn:hover { background: var(--card); }
    .track-head, .track-row {
      display: grid;
      grid-template-columns: 36px 1.4fr 1fr 1fr 56px;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
    }
    .track-head { color: var(--muted); font-size: 0.75rem; border-bottom: 1px solid var(--border); }
    .track-row { border-radius: 6px; cursor: pointer; }
    .track-row:hover { background: var(--card); }
    .track-row.current { background: #243044; }
    .track-row.current .t-title { color: #60a5fa; }
    .t-title, .t-artist, .t-album { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-num, .t-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
    .empty-main { color: var(--muted); margin-top: 48px; }
    .player-bar {
      position: relative;
      height: 92px;
      background: #13161c;
      border-top: 1px solid var(--border);
      padding: 0 20px;
      display: none;
      align-items: center;
      z-index: 50;
    }
    .player-bar.visible { display: grid; grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr); }
    .player-progress {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 4px;
      background: #2a3140;
      cursor: pointer;
    }
    .player-progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }
    .now-playing { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .now-playing img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--card); }
    .now-playing img:not([src]), .now-playing img[src=""] { display: none; }
    .track-meta { min-width: 0; overflow: hidden; }
    .track-meta h4 { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-meta span { font-size: 0.8rem; color: var(--muted); }
    .fringe-pill {
      display: inline-block;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: var(--fringe);
      margin-left: 6px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #1b2029;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 8px;
    }
    .player-tools { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
    button.icon-btn {
      background: transparent;
      color: var(--muted);
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    button.icon-btn:hover { background: #2a3140; color: var(--text); }
    button.icon-btn.faved { color: #fb7185; }
    button.icon-btn.on { color: #60a5fa; }
    button.play-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #111827;
      margin: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      flex-shrink: 0;
    }
    button.play-btn:hover { background: #fff; }
    button.play-btn svg { width: 18px; height: 18px; display: block; }
    button.play-btn svg.play-glyph { width: 16px; height: 18px; margin-left: 3px; }
    .queue-panel {
      position: fixed;
      right: 16px;
      bottom: 96px;
      width: min(380px, calc(100vw - 32px));
      max-height: 55vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      z-index: 60;
      padding: 14px;
    }
    .queue-panel h3 { font-size: 0.95rem; margin-bottom: 10px; }
    .q-row { padding: 8px 6px; border-radius: 6px; }
    .q-row.current { background: #243044; }
    .q-row strong { display: block; font-size: 0.88rem; }
    .q-row span { color: var(--muted); font-size: 0.78rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>📻 NaviRadio</span>
      <span id="modeBadge" class="badge hidden">HAOS Admin</span>
    </div>
    <div class="nav-tabs">
      <button id="toggleAdminBtn" class="secondary hidden" onclick="toggleAdminView()">Admin Settings</button>
      <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log Out</button>
    </div>
  </header>

  <div id="loginView" class="login-box hidden">
    <h2 style="margin-bottom: 6px;">Sign In</h2>
    <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 20px;">
      Use your Navidrome login or a NaviRadio listener account.
    </p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <p id="loginErr" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 12px;"></p>
    <button style="width: 100%;" onclick="doLogin()">Tune In</button>
  </div>

  <div id="appShell" class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-pane" id="mainPane">
      <div id="adminView" class="admin-panel hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
          <h2>HAOS Radio Administration</h2>
          <button onclick="triggerRescan()" id="rescanBtn">Rescan Navidrome & Rebuild Stations</button>
        </div>
        <p id="scanStatus" style="color: #60a5fa; font-size: 0.88rem; margin-bottom: 16px;"></p>

        <div class="admin-grid">
          <div>
            <div class="field">
              <label>Navidrome Server URL</label>
              <input type="text" id="cfgUrl" placeholder="https://music.lonecraft.net" />
            </div>
            <div class="field">
              <label>Navidrome Service Username</label>
              <input type="text" id="cfgUser" autocomplete="off" />
            </div>
            <div class="field">
              <label>Navidrome Service Password</label>
              <input type="password" id="cfgPass" autocomplete="new-password" placeholder="Required for the scan. Not the listener sign-in." />
              <p style="color:var(--muted); font-size:0.78rem; margin-top:6px;">The scan uses these two fields. Signing in at the top does not.</p>
            </div>
            <div class="field">
              <label>
                <input type="checkbox" id="cfgAllowNdAuth" style="width:auto; margin-right:6px;" />
                Allow users to log in with their Navidrome account
              </label>
            </div>
          </div>

          <div>
            <div class="field">
              <label>Fringe Artist Bleed % (0 = Strict Genre, 25–40 = Include Crossover)</label>
              <input type="number" id="cfgFringe" min="0" max="75" />
            </div>
            <div class="field">
              <label>Artist Repeat Cooldown (Tracks between same artist)</label>
              <input type="number" id="cfgCooldown" min="1" max="25" />
            </div>
            <div class="field">
              <label>Minimum Tracks to Auto-Create a Station</label>
              <input type="number" id="cfgMinTracks" min="5" max="100" />
            </div>
            <div class="field">
              <label>Navidrome Libraries / Folders</label>
              <div id="folderCheckboxes" style="font-size:0.85rem; color:var(--muted);"></div>
            </div>
          </div>
        </div>
        <button onclick="saveAdminConfig()">Save Settings</button>

        <hr style="border-color: var(--border); margin: 24px 0;" />
        <h3 style="margin-bottom: 12px;">Fallback Local Listener Accounts</h3>
        <div style="display:flex; gap:10px; max-width:500px; margin-bottom:14px;">
          <input type="text" id="newLocalUser" placeholder="Username" style="padding:8px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:6px;" />
          <input type="password" id="newLocalPass" placeholder="Password" style="padding:8px; background:var(--card); border:1px solid var(--border); color:#fff; border-radius:6px;" />
          <button onclick="addLocalUser()">Add User</button>
        </div>
        <div id="localUserList" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      </div>
      <div id="detail"></div>
    </main>
  </div>

  <div id="queuePanel" class="queue-panel hidden">
    <h3>Radio queue</h3>
    <div id="queueList"></div>
  </div>

  <div id="playerBar" class="player-bar">
    <div class="player-progress" id="progress"><span id="progressFill"></span></div>
    <div class="now-playing">
      <img id="npCover" alt="" />
      <div class="track-meta">
        <h4><span id="npTitle">Nothing playing</span> <span id="npFringe" class="fringe-pill hidden">Fringe</span></h4>
        <span id="npArtist"></span>
      </div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="prevBtn" title="Previous"></button>
      <button class="icon-btn" id="stopBtn" title="Stop"></button>
      <button class="play-btn" id="playPauseBtn" title="Play"></button>
      <button class="icon-btn" id="nextBtn" title="Next"></button>
      <button class="icon-btn on" id="shuffleBtn" title="Shuffle"></button>
    </div>
    <div class="player-tools">
      <button class="icon-btn" id="favBtn" title="Favorite station"></button>
      <button class="icon-btn" id="queueBtn" title="Radio queue"></button>
    </div>
    <audio id="audioEl" preload="auto"></audio>
  </div>

  <script>
    let authToken = localStorage.getItem('naviradio_token') || '';
    let isAdmin = false;
    let stations = [];
    let stationTracks = [];
    let activeStationId = null;
    let queue = [];
    let history = [];
    let current = null;
    let recentArtists = [];
    let recentTracks = [];
    let queueOpen = false;
    let shuffleOn = true;
    const audio = document.getElementById('audioEl');

    const svgPrev = '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 5h2.2v14H6zM19.5 5.5v13l-9.2-6.5z"/></svg>';
    const svgNext = '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.8 5h2.2v14h-2.2zM4.5 5.5l9.2 6.5-9.2 6.5z"/></svg>';
    const svgPlay = '<svg class="play-glyph" viewBox="8 5 12 14" width="16" height="18"><path fill="currentColor" d="M8 5v14l12-7z"/></svg>';
    const svgPause = '<svg viewBox="5 5 14 14" width="16" height="16"><path fill="currentColor" d="M5 5h4.5v14H5zM14.5 5H19v14h-4.5z"/></svg>';
    const svgStop = '<svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>';
    const svgList = '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>';
    const svgShuffle = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>';
    function svgHeart(filled) {
      if (filled) {
        return '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 20s-7-4.35-7-9.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.9C19 15.65 12 20 12 20z"/></svg>';
      }
      return '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 19.2S5.5 15.1 5.5 10.7A3.6 3.6 0 0 1 12 8.2a3.6 3.6 0 0 1 6.5 2.5c0 4.4-6.5 8.5-6.5 8.5z"/></svg>';
    }

    document.getElementById('prevBtn').innerHTML = svgPrev;
    document.getElementById('stopBtn').innerHTML = svgStop;
    document.getElementById('nextBtn').innerHTML = svgNext;
    document.getElementById('shuffleBtn').innerHTML = svgShuffle;
    document.getElementById('queueBtn').innerHTML = svgList;
    document.getElementById('playPauseBtn').innerHTML = svgPlay;
    document.getElementById('favBtn').innerHTML = svgHeart(false);
    document.getElementById('prevBtn').onclick = playPrevious;
    document.getElementById('stopBtn').onclick = stopPlayback;
    document.getElementById('nextBtn').onclick = () => playNext();
    document.getElementById('shuffleBtn').onclick = toggleShuffle;
    document.getElementById('playPauseBtn').onclick = togglePlay;
    document.getElementById('favBtn').onclick = toggleActiveFavorite;
    document.getElementById('queueBtn').onclick = toggleQueuePanel;
    document.getElementById('progress').onclick = seekAudio;

    audio.addEventListener('ended', () => playNext());
    audio.addEventListener('error', () => setTimeout(playNext, 800));
    audio.addEventListener('play', syncPlayIcon);
    audio.addEventListener('pause', syncPlayIcon);
    audio.addEventListener('timeupdate', updateProgress);

    function apiHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (authToken) h['Authorization'] = 'Bearer ' + authToken;
      return h;
    }

    async function init() {
      const res = await fetch('api/context', { headers: apiHeaders() });
      const ctx = await res.json();
      isAdmin = ctx.is_admin;

      if (isAdmin) {
        document.getElementById('modeBadge').classList.remove('hidden');
        document.getElementById('toggleAdminBtn').classList.remove('hidden');
        document.getElementById('appShell').classList.add('visible');
        await loadAdminConfig();
        await loadStations();
        if (ctx.station_count === 0) {
          document.getElementById('adminView').classList.remove('hidden');
        }
      } else if (ctx.authenticated) {
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('appShell').classList.add('visible');
        await loadStations();
      } else {
        document.getElementById('loginView').classList.remove('hidden');
      }
    }

    async function doLogin() {
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;
      const res = await fetch('api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        const data = await res.json();
        authToken = data.token;
        localStorage.setItem('naviradio_token', authToken);
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('appShell').classList.add('visible');
        await loadStations();
      } else {
        document.getElementById('loginErr').textContent = '';
        const text = await res.text();
        document.getElementById('loginErr').textContent = text || 'Invalid login credentials.';
      }
    }

    async function logout() {
      await fetch('api/logout', { method: 'POST', headers: apiHeaders() });
      localStorage.removeItem('naviradio_token');
      authToken = '';
      audio.pause();
      location.reload();
    }

    function toggleAdminView() {
      document.getElementById('adminView').classList.toggle('hidden');
    }

    function stationGroup(st) {
      return st.category === 'Artist Stations' ? 'Artist Stations' : 'Genre Stations';
    }

    function fmtTime(sec) {
      sec = Number(sec) || 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function activeStation() {
      return stations.find(s => s.id === activeStationId) || null;
    }

    async function loadStations() {
      const res = await fetch('api/stations', { headers: apiHeaders() });
      if (!res.ok) return;
      stations = await res.json();
      renderSidebar();
      renderFavoriteButton();
      if (!activeStationId) renderDetail();
    }

    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';
      if (stations.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'side-empty';
        empty.textContent = 'No stations yet. Open Admin Settings and scan Navidrome.';
        sidebar.appendChild(empty);
        return;
      }
      const favorites = stations.filter(s => s.is_favorite).sort((a, b) => a.name.localeCompare(b.name));
      const artists = stations.filter(s => s.category === 'Artist Stations').sort((a, b) => a.name.localeCompare(b.name));
      const genres = stations.filter(s => s.category !== 'Artist Stations').sort((a, b) => a.name.localeCompare(b.name));
      addSideSection(sidebar, 'Favorites', favorites, true);
      addSideSection(sidebar, 'Genre Stations', genres, false);
      addSideSection(sidebar, 'Artist Stations', artists, false);
    }

    function addSideSection(sidebar, label, list, allowEmpty) {
      const title = document.createElement('div');
      title.className = 'side-label';
      title.textContent = label;
      sidebar.appendChild(title);
      if (list.length === 0) {
        if (allowEmpty) {
          const empty = document.createElement('div');
          empty.className = 'side-empty';
          empty.textContent = 'Heart a station to keep it here.';
          sidebar.appendChild(empty);
        }
        return;
      }
      list.forEach(st => {
        const row = document.createElement('div');
        row.className = 'side-station' + (st.id === activeStationId ? ' active' : '');
        const img = document.createElement('img');
        img.alt = '';
        img.src = 'api/cover/' + encodeURIComponent(st.cover_id || st.id);
        img.onerror = () => { img.style.opacity = '0.25'; };
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = st.name;
        const heart = document.createElement('button');
        heart.className = 'side-heart' + (st.is_favorite ? ' faved' : '');
        heart.title = st.is_favorite ? 'Remove favorite' : 'Favorite';
        heart.innerHTML = svgHeart(st.is_favorite);
        heart.onclick = (event) => {
          event.stopPropagation();
          toggleFavorite(st.id, !st.is_favorite);
        };
        row.appendChild(img);
        row.appendChild(name);
        row.appendChild(heart);
        row.onclick = () => selectStation(st.id);
        sidebar.appendChild(row);
      });
    }

    async function selectStation(stationId) {
      activeStationId = stationId;
      renderSidebar();
      renderFavoriteButton();
      await loadStationTracks();
    }

    async function loadStationTracks() {
      const st = activeStation();
      const detail = document.getElementById('detail');
      detail.innerHTML = '';
      if (!st) {
        renderDetail();
        return;
      }
      const res = await fetch('api/stations/' + encodeURIComponent(st.id) + '/tracks', { headers: apiHeaders() });
      stationTracks = res.ok ? await res.json() : [];
      renderDetail();
    }

    function renderDetail() {
      const detail = document.getElementById('detail');
      const st = activeStation();
      if (!st) {
        if (stations.length === 0) return;
        detail.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'empty-main';
        p.textContent = 'Choose a station from the sidebar.';
        detail.appendChild(p);
        return;
      }
      detail.innerHTML = '';
      const hero = document.createElement('div');
      hero.className = 'station-hero';
      const cover = document.createElement('img');
      cover.className = 'hero-cover';
      cover.alt = '';
      cover.src = 'api/cover/' + encodeURIComponent(st.cover_id || st.id);
      const info = document.createElement('div');
      const eye = document.createElement('div');
      eye.className = 'eyebrow';
      eye.textContent = stationGroup(st);
      const h1 = document.createElement('h1');
      h1.textContent = st.name;
      const desc = document.createElement('p');
      desc.textContent = stationTracks.length + ' songs · ' + (st.description || '');
      const actions = document.createElement('div');
      actions.className = 'hero-actions';
      const play = document.createElement('button');
      play.className = 'play-big';
      play.title = 'Play station';
      play.innerHTML = svgPlay;
      play.onclick = () => startStationPlayback(false);
      const shuffle = document.createElement('button');
      shuffle.className = 'text-btn';
      shuffle.title = 'Shuffle and play';
      shuffle.innerHTML = svgShuffle + '<span>Shuffle</span>';
      shuffle.onclick = () => startStationPlayback(true);
      actions.appendChild(play);
      actions.appendChild(shuffle);
      info.appendChild(eye);
      info.appendChild(h1);
      info.appendChild(desc);
      info.appendChild(actions);
      hero.appendChild(cover);
      hero.appendChild(info);
      detail.appendChild(hero);

      const head = document.createElement('div');
      head.className = 'track-head';
      ['#', 'Title', 'Artist', 'Album', 'Time'].forEach(text => {
        const cell = document.createElement('div');
        cell.textContent = text;
        head.appendChild(cell);
      });
      detail.appendChild(head);

      stationTracks.forEach((track, i) => {
        const row = document.createElement('div');
        row.className = 'track-row' + (current && current.id === track.id ? ' current' : '');
        const num = document.createElement('div');
        num.className = 't-num';
        num.textContent = String(i + 1);
        const title = document.createElement('div');
        title.className = 't-title';
        title.textContent = track.title;
        if (track.is_fringe) {
          const pill = document.createElement('span');
          pill.className = 'fringe-pill';
          pill.textContent = 'Fringe';
          title.appendChild(pill);
        }
        const artist = document.createElement('div');
        artist.className = 't-artist';
        artist.textContent = track.artist;
        const album = document.createElement('div');
        album.className = 't-album';
        album.textContent = track.album;
        const time = document.createElement('div');
        time.className = 't-time';
        time.textContent = fmtTime(track.duration);
        row.appendChild(num);
        row.appendChild(title);
        row.appendChild(artist);
        row.appendChild(album);
        row.appendChild(time);
        row.onclick = () => playSong(track);
        detail.appendChild(row);
      });
    }

    async function toggleFavorite(stationId, makeFav) {
      await fetch('api/stations/' + encodeURIComponent(stationId) + '/favorite', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({ favorite: makeFav })
      });
      await loadStations();
      if (activeStationId === stationId) renderDetail();
    }

    function toggleActiveFavorite() {
      const st = activeStation();
      if (!st) return;
      toggleFavorite(st.id, !st.is_favorite);
    }

    function renderFavoriteButton() {
      const st = activeStation();
      const btn = document.getElementById('favBtn');
      btn.innerHTML = svgHeart(!!(st && st.is_favorite));
      btn.classList.toggle('faved', !!(st && st.is_favorite));
    }

    function syncPlayIcon() {
      const playing = !audio.paused && !audio.ended && !!current;
      document.getElementById('playPauseBtn').innerHTML = playing ? svgPause : svgPlay;
      document.getElementById('playPauseBtn').title = playing ? 'Pause' : 'Play';
    }

    function toggleQueuePanel() {
      queueOpen = !queueOpen;
      document.getElementById('queuePanel').classList.toggle('hidden', !queueOpen);
      document.getElementById('queueBtn').classList.toggle('on', queueOpen);
      if (queueOpen) renderQueuePanel();
    }

    function renderQueuePanel() {
      const list = document.getElementById('queueList');
      list.innerHTML = '';
      const rows = [];
      if (current) rows.push({ track: current, label: 'Now playing' });
      queue.forEach(track => rows.push({ track, label: 'Up next' }));
      if (rows.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'side-empty';
        empty.textContent = 'Press play to start this station.';
        list.appendChild(empty);
        return;
      }
      rows.forEach((row, i) => {
        const item = document.createElement('div');
        item.className = 'q-row' + (i === 0 && current ? ' current' : '');
        const title = document.createElement('strong');
        title.textContent = row.track.title;
        const meta = document.createElement('span');
        meta.textContent = row.label + ' · ' + row.track.artist;
        item.appendChild(title);
        item.appendChild(meta);
        list.appendChild(item);
      });
    }

    function syncShuffleIcon() {
      document.getElementById('shuffleBtn').classList.toggle('on', shuffleOn);
    }

    function toggleShuffle() {
      shuffleOn = !shuffleOn;
      syncShuffleIcon();
      if (current) {
        queue = upcomingAfter(current);
        renderQueuePanel();
      }
    }

    function mixTracks(tracks) {
      const buckets = new Map();
      tracks.forEach(track => {
        const key = (track.artist || 'unknown').toLowerCase();
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(track);
      });
      buckets.forEach(list => {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const swap = list[i];
          list[i] = list[j];
          list[j] = swap;
        }
      });
      const keys = Array.from(buckets.keys());
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const swap = keys[i];
        keys[i] = keys[j];
        keys[j] = swap;
      }
      const mixed = [];
      let remaining = tracks.length;
      while (remaining > 0) {
        let placed = false;
        keys.forEach(key => {
          const list = buckets.get(key);
          if (list.length) {
            mixed.push(list.pop());
            remaining -= 1;
            placed = true;
          }
        });
        if (!placed) break;
      }
      return mixed;
    }

    function upcomingAfter(track) {
      const rest = stationTracks.filter(t => t.id !== track.id);
      if (shuffleOn) return mixTracks(rest);
      const idx = stationTracks.findIndex(t => t.id === track.id);
      if (idx < 0) return rest;
      return stationTracks.slice(idx + 1).concat(stationTracks.slice(0, idx));
    }

    function updateProgress() {
      const fill = document.getElementById('progressFill');
      if (!audio.duration || !isFinite(audio.duration)) {
        fill.style.width = '0%';
        return;
      }
      fill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    }

    function seekAudio(event) {
      if (!audio.duration || !isFinite(audio.duration)) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    }

    async function startStationPlayback(forceShuffle) {
      if (!activeStationId || !stationTracks.length) return;
      if (forceShuffle) shuffleOn = true;
      syncShuffleIcon();
      history = [];
      current = null;
      queue = shuffleOn ? mixTracks(stationTracks) : stationTracks.slice();
      await playNext();
    }

    async function playSong(track) {
      if (!activeStationId) return;
      queue = upcomingAfter(track);
      beginTrack(track, false);
    }

    function beginTrack(track, fromHistory) {
      if (!fromHistory && current && current.id !== track.id) history.push(current);
      current = track;
      recentArtists.push(track.artist);
      recentTracks.push(track.id);
      document.getElementById('npTitle').textContent = track.title;
      document.getElementById('npArtist').textContent = track.artist + ' — ' + track.album;
      document.getElementById('npCover').src = 'api/cover/' + encodeURIComponent(track.id);
      document.getElementById('npFringe').classList.toggle('hidden', !track.is_fringe);
      audio.src = 'api/stream/' + encodeURIComponent(track.id);
      audio.play();
      document.getElementById('playerBar').classList.add('visible');
      highlightCurrent();
      renderQueuePanel();
      syncPlayIcon();
    }

    function highlightCurrent() {
      document.querySelectorAll('#detail .track-row').forEach((row, i) => {
        const track = stationTracks[i];
        row.classList.toggle('current', !!(track && current && track.id === current.id));
      });
    }

    async function playNext() {
      if (!queue.length && stationTracks.length) {
        queue = shuffleOn ? mixTracks(stationTracks.filter(t => !current || t.id !== current.id)) : [];
      }
      const next = queue.shift();
      if (!next) return;
      beginTrack(next, false);
    }

    function playPrevious() {
      if (current && audio.currentTime > 3) {
        audio.currentTime = 0;
        if (audio.paused) audio.play();
        return;
      }
      const prev = history.pop();
      if (!prev) {
        audio.currentTime = 0;
        return;
      }
      if (current) queue.unshift(current);
      beginTrack(prev, true);
    }

    function stopPlayback() {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      current = null;
      queue = [];
      history = [];
      queueOpen = false;
      document.getElementById('playerBar').classList.remove('visible');
      document.getElementById('queuePanel').classList.add('hidden');
      document.getElementById('queueBtn').classList.remove('on');
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('npCover').removeAttribute('src');
      highlightCurrent();
    }

    function togglePlay() {
      if (!current) {
        startStationPlayback();
        return;
      }
      if (audio.paused) audio.play();
      else audio.pause();
    }

    async function loadAdminConfig() {
      const res = await fetch('api/admin/config');
      if (!res.ok) return;
      const data = await res.json();
      const c = data.config;
      document.getElementById('cfgUrl').value = c.navidrome_url;
      document.getElementById('cfgUser').value = c.navidrome_user;
      document.getElementById('cfgAllowNdAuth').checked = c.allow_navidrome_auth;
      document.getElementById('cfgFringe').value = c.fringe_percentage;
      document.getElementById('cfgCooldown').value = c.artist_cooldown;
      document.getElementById('cfgMinTracks').value = c.min_station_tracks;

      const fDiv = document.getElementById('folderCheckboxes');
      if (data.available_folders.length === 0) {
        fDiv.textContent = 'All libraries included (save credentials to list specific folders).';
      } else {
        fDiv.innerHTML = data.available_folders.map(f => `
          <label style="display:block; margin-bottom:4px;">
            <input type="checkbox" class="folder-cb" value="${f.id}" ${c.selected_folders.includes(f.id) ? 'checked' : ''} />
            ${f.name} (ID: ${f.id})
          </label>
        `).join('');
      }

      const uDiv = document.getElementById('localUserList');
      uDiv.innerHTML = data.local_users.map(u => `
        <span class="badge" style="display:flex; align-items:center; gap:6px;">
          ${u}
          <a href="#" onclick="deleteLocalUser('${u}'); return false;" style="color:#ef4444; text-decoration:none;">✕</a>
        </span>
      `).join('');
    }

    async function saveAdminConfig() {
      const selected_folders = Array.from(document.querySelectorAll('.folder-cb:checked')).map(cb => cb.value);
      const payload = {
        navidrome_url: document.getElementById('cfgUrl').value,
        navidrome_user: document.getElementById('cfgUser').value,
        navidrome_pass: document.getElementById('cfgPass').value,
        allow_navidrome_auth: document.getElementById('cfgAllowNdAuth').checked,
        selected_folders,
        fringe_percentage: parseInt(document.getElementById('cfgFringe').value || '25', 10),
        artist_cooldown: parseInt(document.getElementById('cfgCooldown').value || '6', 10),
        min_station_tracks: parseInt(document.getElementById('cfgMinTracks').value || '15', 10)
      };
      await fetch('api/admin/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('scanStatus').textContent = 'Settings saved.';
      await loadAdminConfig();
    }

    async function triggerRescan() {
      const btn = document.getElementById('rescanBtn');
      btn.disabled = true;
      document.getElementById('scanStatus').textContent = 'Checking the Navidrome login and scanning the library...';
      const selected_folders = Array.from(document.querySelectorAll('.folder-cb:checked')).map(cb => cb.value);
      const res = await fetch('api/admin/rescan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          navidrome_url: document.getElementById('cfgUrl').value.trim(),
          navidrome_user: document.getElementById('cfgUser').value.trim(),
          navidrome_pass: document.getElementById('cfgPass').value,
          selected_folders
        })
      });
      const data = await res.json();
      btn.disabled = false;
      if (res.ok) {
        document.getElementById('cfgPass').value = '';
        document.getElementById('scanStatus').textContent =
          `Indexed ${data.tracks_indexed} tracks and built ${data.stations_created} dynamic stations.`;
        await loadStations();
        await loadAdminConfig();
      } else {
        document.getElementById('scanStatus').textContent = 'Error: ' + (data.message || 'Scan failed');
      }
    }

    async function addLocalUser() {
      const username = document.getElementById('newLocalUser').value;
      const password = document.getElementById('newLocalPass').value;
      if (!username || !password) return;
      await fetch('api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      document.getElementById('newLocalUser').value = '';
      document.getElementById('newLocalPass').value = '';
      await loadAdminConfig();
    }

    async function deleteLocalUser(u) {
      await fetch(`api/admin/users/${encodeURIComponent(u)}`, { method: 'DELETE' });
      await loadAdminConfig();
    }

    init();
  </script>
