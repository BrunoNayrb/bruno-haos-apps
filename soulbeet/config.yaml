name: Soulbeet
version: "0.7.1-localdb3"
slug: soulbeet
description: >-
  Home Assistant package of Soulbeet by Terry Raimondo (terry90/soulbeet).
  Runs his published image. Beets databases stay on local storage so imports
  do not lock on a network share.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  9765/tcp: 9765
map:
  - type: share
    read_only: false
options:
  download_path: "/share/Media/slskd/downloads"
  music_base: "/share/Media/Music"
  navidrome_url: ""
schema:
  download_path: str
  music_base: str
  navidrome_url: str?
url: https://github.com/terry90/soulbeet
